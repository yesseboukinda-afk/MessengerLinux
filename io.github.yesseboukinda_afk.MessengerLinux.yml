app-id: io.github.yesseboukinda_afk.MessengerLinux
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: messenger

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: messenger-linux
    buildsystem: simple

    build-commands:
      - gcc src/main.c -o messenger $(pkg-config --cflags --libs gtk4 webkitgtk-6.0)
      - install -Dm755 messenger /app/bin/messenger
      - install -Dm644 data/io.github.yesseboukinda_afk.MessengerLinux.desktop /app/share/applications/io.github.yesseboukinda_afk.MessengerLinux.desktop
      - install -Dm644 icons/512x512/io.github.yesseboukinda_afk.MessengerLinux.png /app/share/icons/hicolor/512x512/apps/io.github.yesseboukinda_afk.MessengerLinux.png
      - install -Dm644 data/io.github.yesseboukinda_afk.MessengerLinux.metainfo.xml /app/share/metainfo/io.github.yesseboukinda_afk.MessengerLinux.metainfo.xml

    sources:
      - type: archive
        url: https://github.com/yesseboukinda-afk/MessengerLinux/archive/refs/tags/v1.0.2.tar.gz
        sha256: 713391cea779cdb24ac52a70600e38389879844f6ca3b8601751705db40304d8
        strip-components: 1
