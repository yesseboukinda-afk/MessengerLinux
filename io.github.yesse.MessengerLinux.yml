app-id: io.github.yesse.MessengerLinux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: messenger

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: messenger-linux
    buildsystem: simple

    build-commands:
      - gcc main.c -o messenger $(pkg-config --cflags --libs gtk4 webkitgtk-6.0)
      - install -Dm755 messenger /app/bin/messenger
      - install -Dm644 io.github.yesse.MessengerLinux.desktop /app/share/applications/io.github.yesse.MessengerLinux.desktop
      - install -Dm644 io.github.yesse.MessengerLinux.png /app/share/icons/hicolor/512x512/apps/io.github.yesse.MessengerLinux.png
      - install -Dm644 io.github.yesse.MessengerLinux.metainfo.xml /app/share/metainfo/io.github.yesse.MessengerLinux.metainfo.xml

    sources:
      - type: dir
        path: src

      - type: file
        path: data/io.github.yesse.MessengerLinux.desktop
        dest-filename: io.github.yesse.MessengerLinux.desktop

      - type: file
        path: icons/512x512/io.github.yesse.MessengerLinux.png
        dest-filename: io.github.yesse.MessengerLinux.png

      - type: file
        path: data/io.github.yesse.MessengerLinux.metainfo.xml
        dest-filename: io.github.yesse.MessengerLinux.metainfo.xml
